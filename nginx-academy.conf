# ==============================================================================
# NGINX CONFIGURATION FOR BCS ACADEMY PORTAL
# Domain: academy.bcslabs.tech -> Container Port: 3005
# ==============================================================================
# Petunjuk Pemasangan di Server Biznet:
# 1. Salin konfigurasi ini ke: /etc/nginx/sites-available/academy.bcslabs.tech
# 2. Buat symlink: sudo ln -s /etc/nginx/sites-available/academy.bcslabs.tech /etc/nginx/sites-enabled/
# 3. Uji konfigurasi: sudo nginx -t
# 4. Generate SSL: sudo certbot --nginx -d academy.bcslabs.tech
# 5. Reload Nginx: sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    server_name academy.bcslabs.tech;

    # Redirect seluruh HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name academy.bcslabs.tech;

    # SSL Certificates (Akan otomatis diatur oleh Certbot Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/academy.bcslabs.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/academy.bcslabs.tech/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
